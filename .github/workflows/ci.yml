name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: forge
      DB_PASSWORD: forge
      DB_NAME: forge
      DB_NAME_TEST: forge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm --prefix api ci
      - run: npm --prefix api run lint
      - run: npm --prefix api run test
      - run: npm --prefix api run build
      - run: npm --prefix api run test:e2e

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  # Publica a API no servidor depois que o job `api` passa num push na main.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api
    runs-on: ubuntu-latest
    # Um deploy por vez; um push novo espera o anterior terminar.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # Avança a main do servidor exatamente até o commit testado (nunca além dele).
        # O serviço `migrate` roda as migrations antes de a API nova subir.
        run: |
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" <<'SCRIPT'
          set -euo pipefail
          cd ~/brios3d_forge
          git fetch --quiet origin main
          git merge --ff-only "$1"
          cd deploy
          docker compose -f docker-compose.prod.yml up -d --build --wait
          docker image prune -f
          SCRIPT
